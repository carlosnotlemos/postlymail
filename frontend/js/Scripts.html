<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Carregamento inicial único para máxima performance
    google.script.run
      .withSuccessHandler(inicializarApp)
      .withFailureHandler(err => showToast("Erro no carregamento inicial: " + err, false))
      .getAppState();
  });

  function inicializarApp(state) {
    clientesGlobais = state.clientes;
    produtosGlobais = state.produtos;
    estoqueGlobais = state.estoque || [];
    historicoEstoqueGlobais = state.historicoEstoque || [];
    vendasGlobais = state.vendas;
    custosGlobais = state.custos || [];
    rentabilidadeGlobais = state.rentabilidade || [];
    campanhasGlobais = state.campanhas;
    enviosGlobais = state.envios;

    // Personalização do Usuário (Baseado na conta Google)
    const email = state.userEmail || "email@exemplo.com";
    const partes = email.split('@')[0].split('.');
    const primeiroNome = partes[0].charAt(0).toUpperCase() + partes[0].slice(1);
    const nomeCompleto = partes.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
    const iniciais = (partes[0].charAt(0) + (partes[1] ? partes[1].charAt(0) : "")).toUpperCase();

    document.getElementById('topbar-user-name').textContent = nomeCompleto;
    document.getElementById('topbar-user-email').textContent = email;
    document.getElementById('topbar-user-initials').textContent = iniciais;
    document.getElementById('dash-welcome-msg').innerHTML = `Bem-vindo de volta, <strong>${primeiroNome}</strong>. Aqui está o resumo do seu negócio.`;

    // Renderiza todas as tabelas em segundo plano
    renderizarDashboard();
    renderizarTabelaClientes(clientesGlobais);
    renderizarTabelaProdutos(produtosGlobais);
    popularDatalistCompra();
    renderizarTabelaEstoque(estoqueGlobais);
    renderizarTabelaHistoricoEstoque(historicoEstoqueGlobais);
    atualizarSelectProdutosHistorico();
    renderizarTabelaVendas(vendasGlobais);
    renderizarTabelaCustos(custosGlobais);
    renderizarTabelaCampanhas(campanhasGlobais);
    renderizarTabelaEnvios(enviosGlobais);

    // Esconde possíveis esqueletos ou spinners iniciais
    console.log("App Inicializado com sucesso.");
  }

  function parseReal(val) {
    if (val === null || val === undefined) return 0;
    if (typeof val === 'number') return val;
    let str = val.toString().trim();
    if (!str) return 0;
    if (str.indexOf(',') !== -1) {
      str = str.replace(/\./g, '').replace(',', '.');
    }
    str = str.replace(/[^\d.-]/g, '');
    return parseFloat(str) || 0;
  }

  function renderizarDashboard() {
    // 1. Métricas de Clientes
    document.getElementById('dash-total-clientes').textContent = clientesGlobais.length;

    // 2. Métricas de Vendas (LTV e AOV)
    let faturamentoTotal = 0;
    vendasGlobais.forEach(v => {
      const valor = parseReal(v[3]);
      faturamentoTotal += valor;
    });

    const ticketMedio = vendasGlobais.length > 0 ? (faturamentoTotal / vendasGlobais.length) : 0;

    document.getElementById('dash-faturamento-total').textContent = `R$ ${faturamentoTotal.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    document.getElementById('dash-ticket-medio').textContent = `R$ ${ticketMedio.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    // 3. Métricas de Engajamento (Total de Envios)
    let totalEmailsDisparados = 0;
    enviosGlobais.forEach(e => {
      const qtd = parseInt(e[3]) || 0;
      totalEmailsDisparados += qtd;
    });
    document.getElementById('dash-total-envios').textContent = totalEmailsDisparados;

    // 4. Métricas de Custos e Faturamento Líquido
    let totalCustos = 0;
    custosGlobais.forEach(c => {
      const valor = parseReal(c[3]);
      totalCustos += valor;
    });

    const faturamentoLiquido = faturamentoTotal - totalCustos;

    document.getElementById('dash-total-custos').textContent = `R$ ${totalCustos.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    document.getElementById('dash-faturamento-liquido').textContent = `R$ ${faturamentoLiquido.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

    // 4. Vendas Recentes (Top 5)
    const tbody = document.getElementById('dash-corpo-vendas-recentes');
    if (tbody) {
      if (vendasGlobais.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: var(--text-muted);">Nenhuma venda realizada ainda.</td></tr>';
      } else {
        let html = '';
        // Pega as últimas 5 vendas (vendasGlobais já vem em ordem cronológica?)
        // Vamos assumir que sim, e reverter para ver as mais recentes.
        [...vendasGlobais].reverse().slice(0, 5).forEach(v => {
          const nomeCliente = v[4] || "";
          const email = v[2];
          html += `
            <tr>
              <td><span style="font-size: 11px; font-weight: 600; color: var(--accent);">${v[0]}</span></td>
              <td>${v[1]}</td>
              <td>
                <strong style="color: var(--text-main); font-size: 13px;">${nomeCliente}</strong><br>
                <span style="font-size: 11px; color: var(--text-muted);">${email}</span>
              </td>
              <td style="font-weight: 600; color: var(--success);">R$ ${parseReal(v[3]).toFixed(2)}</td>
            </tr>
          `;
        });
        tbody.innerHTML = html;
      }
    }
  }

  // =========================================================
  // 1. VARIÁVEIS GLOBAIS
  // =========================================================
  let produtosGlobais = [];
  let clientesGlobais = [];
  let estoqueGlobais = [];
  let historicoEstoqueGlobais = [];
  let vendasGlobais = [];
  let custosGlobais = [];
  let rentabilidadeGlobais = [];
  let campanhasGlobais = [];
  let enviosGlobais = [];
  let carrinhoDeCompras = [];
  let carrinhoDeVendaCustos = [];
  let idPedidoEdicao = null;

  // =========================================================
  // 2. CONTROLE DE INTERFACE (UI) & NAVEGAÇÃO
  // =========================================================

  function showPage(pageId, btnElement) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

    const targetPage = document.getElementById(pageId);
    if (targetPage) targetPage.classList.add('active');
    if (btnElement) btnElement.classList.add('active');

    // Refresh das tabelas específicas se necessário ao trocar de aba
    if (pageId === 'page-dashboard') renderizarDashboard();
    if (pageId === 'page-envio') renderizarTabelaEnvios(enviosGlobais);
    if (pageId === 'page-campanha') renderizarTabelaCampanhas(campanhasGlobais);
    if (pageId === 'page-cliente') renderizarTabelaClientes(clientesGlobais);
    if (pageId === 'page-produto') renderizarTabelaProdutos(produtosGlobais);
    if (pageId === 'page-estoque') {
      carregarListaEstoque();
    }
    if (pageId === 'page-estoque-historico') {
      carregarHistoricoEstoque();
      atualizarSelectProdutosHistorico();
    }
    if (pageId === 'page-compra') renderizarTabelaVendas(vendasGlobais);
  }

  function showToast(msg, isSuccess) {
    const panel = document.getElementById('status-panel');
    const toast = document.createElement('div');
    toast.className = `toast ${isSuccess ? 'success' : 'error'}`;

    const icon = isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation';

    toast.innerHTML = `<i class="fa-solid ${icon}"></i><span>${msg}</span>`;

    panel.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 100);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 6000);
  }

  function setLoading(btnId, isLoading, defaultText) {
    const btn = document.getElementById(btnId);
    const textSpan = btn.querySelector('.btn-text');

    if (isLoading) {
      btn.disabled = true;
      btn.classList.add('loading');
      textSpan.textContent = 'Processando...';
    } else {
      btn.disabled = false;
      btn.classList.remove('loading');
      textSpan.textContent = defaultText;
    }
  }

  // =========================================================
  // 3. LÓGICA DO CARRINHO DE COMPRAS & FORMATAÇÃO
  // =========================================================

  function aplicarMascaraMoeda(event) {
    let elemento = event.target;
    let valor = elemento.value.replace(/\D/g, '');
    if (valor === '') { elemento.value = ''; return; }

    valor = (parseInt(valor) / 100).toFixed(2) + '';
    valor = valor.replace('.', ',');
    valor = valor.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
    elemento.value = valor;
  }

  function calcularSubtotal() {
    const nomeProduto = (document.getElementById('compra-produto').value || '').trim();
    const qtd = document.getElementById('compra-qtd').value;
    const produto = (produtosGlobais || []).find(p => p[0] && p[0].trim().toLowerCase() === nomeProduto.toLowerCase());

    if (produto && qtd) {
      const subtotal = parseFloat(produto[1]) * parseInt(qtd);
      document.getElementById('compra-subtotal').value = subtotal.toFixed(2);
    } else {
      document.getElementById('compra-subtotal').value = '';
    }
  }

  function adicionarAoCarrinho() {
    const inputProduto = document.getElementById('compra-produto');
    const produtoDigitado = (inputProduto ? inputProduto.value : '').trim();
    const qtd = parseInt(document.getElementById('compra-qtd').value);
    const subtotalStr = document.getElementById('compra-subtotal').value;
    const subtotal = parseFloat(subtotalStr);

    if (!produtoDigitado) return showToast("Por favor, selecione ou digite um produto primeiro.", false);

    const produto = (produtosGlobais || []).find(p => p[0] && p[0].trim().toLowerCase() === produtoDigitado.toLowerCase());
    if (!produto) {
      return showToast(`O produto "${produtoDigitado}" não foi encontrado no catálogo. Selecione um produto da lista.`, false);
    }

    if (isNaN(subtotal) || subtotal <= 0) return showToast("Quantidade ou valor inválido.", false);

    carrinhoDeCompras.push({ produto: produto[0], quantidade: qtd, valorTotal: subtotal });
    atualizarInterfaceCarrinho();

    if (inputProduto) inputProduto.value = '';
    document.getElementById('compra-qtd').value = 1;
    document.getElementById('compra-subtotal').value = '';
  }

  function removerDoCarrinho(index) {
    carrinhoDeCompras.splice(index, 1);
    atualizarInterfaceCarrinho();
  }

  function atualizarInterfaceCarrinho() {
    const lista = document.getElementById('lista-carrinho');
    const totalGeralSpan = document.getElementById('carrinho-total-geral');

    if (carrinhoDeCompras.length === 0) {
      lista.innerHTML = '<li style="color: var(--text-muted); font-style: italic;">Nenhum item adicionado ainda.</li>';
      totalGeralSpan.textContent = '0.00';
      return;
    }

    let html = '';
    let totalGeral = 0;

    carrinhoDeCompras.forEach((item, index) => {
      totalGeral += item.valorTotal;
      html += `
        <li style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);">
          <span><strong style="color: var(--cyan);">${item.quantidade}x</strong> ${item.produto}</span>
          <span>R$ ${item.valorTotal.toFixed(2)} <i class="fa-solid fa-trash" style="color: var(--error); cursor: pointer; margin-left: 15px;" onclick="removerDoCarrinho(${index})"></i></span>
        </li>`;
    });

    lista.innerHTML = html;
    totalGeralSpan.textContent = totalGeral.toFixed(2);
  }

  // =========================================================
  // 4. COMUNICAÇÃO COM O BACK-END (Google Apps Script)
  // =========================================================

  function popularDatalistCompra(dados) {
    const clientes = (dados && dados.clientes) ? dados.clientes : clientesGlobais;
    const produtos = (dados && dados.produtos) ? dados.produtos : produtosGlobais;

    const dlClientes = document.getElementById('lista-clientes-compra');
    if (dlClientes) {
      const clientesOrdenados = [...(clientes || [])].sort((a, b) => {
        const nomeA = (a[0] || '').toString();
        const nomeB = (b[0] || '').toString();
        return nomeA.localeCompare(nomeB, 'pt-BR', { sensitivity: 'base' });
      });

      dlClientes.innerHTML = clientesOrdenados.map(c => {
        const val = c[1] || c[0];
        const display = c[1] ? `${c[0]} (${c[1]})` : `${c[0]}`;
        return `<option value="${val}">${display}</option>`;
      }).join('');
    }

    const dlProdutos = document.getElementById('lista-produtos-compra');
    if (dlProdutos) {
      const produtosOrdenados = [...(produtos || [])].sort((a, b) => {
        const nomeA = (a[0] || '').toString();
        const nomeB = (b[0] || '').toString();
        return nomeA.localeCompare(nomeB, 'pt-BR', { sensitivity: 'base' });
      });

      dlProdutos.innerHTML = produtosOrdenados.map(p => `<option value="${p[0]}">`).join('');
    }
  }

  function carregarDadosCompra() {
    google.script.run.withSuccessHandler(dados => {
      produtosGlobais = dados.produtos;
      popularDatalistCompra(dados);
      document.getElementById('compra-subtotal').value = '';
    }).getDadosParaCompra();
  }


  function salvarCliente() {
    setLoading('btn-cliente', true, 'Salvar Cliente');

    const emailOriginal = document.getElementById('c-email-original').value;
    const dados = {
      nome: document.getElementById('c-nome').value,
      email: document.getElementById('c-email').value,
      telefone: document.getElementById('c-tel').value,
      emailOriginal: emailOriginal
    };

    const nomeFuncaoBackend = emailOriginal ? 'atualizarCliente' : 'salvarCliente';

    google.script.run.withSuccessHandler(res => {
      showToast(res.mensagem, res.sucesso);
      setLoading('btn-cliente', false, 'Salvar Cliente');

      if (res.sucesso === true) {
        voltarParaListaClientes(); // Volta para a tabela após salvar
      }
    })[nomeFuncaoBackend](dados);
  }

  function mostrarFormCliente(isEdit = false) {
    document.getElementById('view-lista-cliente').style.display = 'none';
    document.getElementById('view-form-cliente').style.display = 'block';
    document.getElementById('btn-novo-cliente').style.display = 'none';

    if (isEdit) {
      document.getElementById('titulo-pagina-cliente').innerHTML = 'Editar Cliente';
      document.getElementById('subtitulo-pagina-cliente').innerHTML = 'Atualize os dados de contato abaixo';
    } else {
      document.getElementById('titulo-pagina-cliente').innerHTML = 'Cadastrar Cliente';
      document.getElementById('subtitulo-pagina-cliente').innerHTML = 'Adicione um novo contato à base';

      // Limpa os campos para um novo cadastro
      document.getElementById('c-email-original').value = '';
      document.getElementById('c-nome').value = '';
      document.getElementById('c-email').value = '';
      document.getElementById('c-tel').value = '';
    }
  }

  function voltarParaListaClientes() {
    document.getElementById('view-lista-cliente').style.display = 'block';
    document.getElementById('view-form-cliente').style.display = 'none';
    document.getElementById('btn-novo-cliente').style.display = 'block';

    document.getElementById('titulo-pagina-cliente').innerHTML = 'Clientes';
    document.getElementById('subtitulo-pagina-cliente').innerHTML = 'Gerencie sua base de contatos';

    carregarListaClientes(); // Atualiza a tabela para garantir dados frescos
  }

  function abrirEdicaoCliente(index) {
    const c = clientesGlobais[index];

    // Preenche os campos do formulário com os dados da tabela
    document.getElementById('c-email-original').value = c[1]; // Campo oculto com e-mail antigo
    document.getElementById('c-nome').value = c[0];
    document.getElementById('c-email').value = c[1];
    document.getElementById('c-tel').value = c[2];

    mostrarFormCliente(true); // Chama a função dizendo que é modo Edição
  }

  function salvarProduto() {
    const precoTexto = document.getElementById('p-preco').value;
    const precoLimpo = precoTexto.replace(/\./g, '').replace(',', '.');
    const precoNumerico = parseFloat(precoLimpo);

    if (isNaN(precoNumerico) || precoNumerico <= 0) return showToast('Por favor, informe um preço válido.', false);

    setLoading('btn-produto', true, 'Catalogar Produto');
    const nomeOriginal = document.getElementById('p-nome-original').value;
    const dados = {
      nome: document.getElementById('p-nome').value,
      preco: precoNumerico,
      descricao: document.getElementById('p-desc').value,
      nomeOriginal: nomeOriginal
    };

    const nomeFuncaoBackend = nomeOriginal ? 'atualizarProduto' : 'salvarProduto';

    google.script.run.withSuccessHandler(res => {
      showToast(res.mensagem, res.sucesso);
      setLoading('btn-produto', false, 'Catalogar Produto');
      if (res.sucesso === true) {
        voltarParaListaProdutos();
        document.querySelectorAll('#page-produto input').forEach(input => input.value = '');
      }
    })[nomeFuncaoBackend](dados);
  }

  function mostrarFormProduto(isEdit = false) {
    document.getElementById('view-lista-produto').style.display = 'none';
    document.getElementById('view-form-produto').style.display = 'block';
    document.getElementById('btn-novo-produto').style.display = 'none';

    if (isEdit) {
      document.getElementById('titulo-pagina-produto').innerHTML = 'Editar Produto';
      document.getElementById('subtitulo-pagina-produto').innerHTML = 'Atualize as informações do item no catálogo';
    } else {
      document.getElementById('titulo-pagina-produto').innerHTML = 'Catalogar Produto';
      document.getElementById('subtitulo-pagina-produto').innerHTML = 'Cadastre um novo item disponível para venda';

      // Limpa os campos para um novo cadastro
      document.getElementById('p-nome-original').value = '';
      document.getElementById('p-nome').value = '';
      document.getElementById('p-preco').value = '';
      document.getElementById('p-desc').value = '';
    }
  }

  function voltarParaListaProdutos() {
    document.getElementById('view-lista-produto').style.display = 'block';
    document.getElementById('view-form-produto').style.display = 'none';
    document.getElementById('btn-novo-produto').style.display = 'block';

    document.getElementById('titulo-pagina-produto').innerHTML = 'Catálogo de Produtos';
    document.getElementById('subtitulo-pagina-produto').innerHTML = 'Gerencie os itens disponíveis para venda no seu ecossistema';

    carregarListaProdutos(); // Atualiza a tabela
  }

  function abrirEdicaoProduto(index) {
    const p = produtosGlobais[index];

    // Preenche os campos do formulário com os dados da tabela
    document.getElementById('p-nome-original').value = p[0];
    document.getElementById('p-nome').value = p[0];
    document.getElementById('p-preco').value = p[1];
    document.getElementById('p-desc').value = p[2];

    mostrarFormProduto(true);
  }

  function confirmarExcluirProduto(nome) {
    if (confirm(`Tem certeza que deseja remover o produto "${nome}" do catálogo?`)) {
      document.getElementById('corpo-tabela-produtos').innerHTML = '<tr><td colspan="4" style="text-align:center;"><div class="spinner" style="display:inline-block; border-top-color: var(--error);"></div> Excluindo...</td></tr>';

      google.script.run.withSuccessHandler(res => {
        showToast(res.mensagem, res.sucesso);
        carregarListaProdutos();
      }).excluirProduto(nome);
    }
  }

  function carregarListaProdutos() {
    google.script.run.withSuccessHandler(produtos => {
      produtosGlobais = produtos;
      renderizarTabelaProdutos(produtos);
    }).getProdutos();
  }

  function renderizarTabelaProdutos(produtos) {
    const tbody = document.getElementById('corpo-tabela-produtos');
    if (!tbody) return;

    if (produtos.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--text-muted); padding: 30px;">Nenhum produto cadastrado ainda.</td></tr>';
      return;
    }

    let html = '';
    produtos.forEach((p, index) => {
      html += `
        <tr>
          <td><strong style="color: var(--text-main);">${p[0]}</strong></td>
          <td>R$ ${p[1]}</td>
          <td style="font-size: 13px; color: var(--text-muted);">${p[2]}</td>
          <td>
            <button class="btn-icon-action" onclick="abrirEdicaoProduto(${index})" title="Editar">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="btn-icon-action" onclick="confirmarExcluirProduto('${p[0]}')" title="Excluir" style="color: var(--error); margin-left: 10px;">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function popularDatalistEstoque() {
    const datalist = document.getElementById('lista-produtos-estoque');
    if (datalist) {
      const produtosOrdenados = [...(produtosGlobais || [])].sort((a, b) => {
        const nomeA = (a[0] || '').toString();
        const nomeB = (b[0] || '').toString();
        return nomeA.localeCompare(nomeB, 'pt-BR', { sensitivity: 'base' });
      });
      datalist.innerHTML = produtosOrdenados.map(p => `<option value="${p[0]}">`).join('');
    }
  }

  function carregarListaEstoque() {
    google.script.run.withSuccessHandler(estoque => {
      estoqueGlobais = estoque;
      renderizarTabelaEstoque(estoque);
      popularDatalistEstoque();
    }).getEstoque();
  }

  function mostrarFormEstoque(isEdit = false, produtoSelecionado = '') {
    document.getElementById('view-lista-estoque').style.display = 'none';
    document.getElementById('view-form-estoque').style.display = 'block';
    document.getElementById('btn-novo-estoque').style.display = 'none';

    popularDatalistEstoque();

    const inputProduto = document.getElementById('estoque-produto');

    if (isEdit) {
      document.getElementById('titulo-pagina-estoque').innerHTML = 'Editar Item de Estoque';
      document.getElementById('subtitulo-pagina-estoque').innerHTML = 'Atualize a quantidade disponível para esse produto';
      if (inputProduto) {
        inputProduto.value = produtoSelecionado || '';
        inputProduto.readOnly = true;
        inputProduto.style.opacity = '0.7';
      }
    } else {
      document.getElementById('titulo-pagina-estoque').innerHTML = 'Cadastrar Estoque';
      document.getElementById('subtitulo-pagina-estoque').innerHTML = 'Defina a quantidade disponível por produto';
      document.getElementById('estoque-produto-original').value = '';
      if (inputProduto) {
        inputProduto.value = '';
        inputProduto.readOnly = false;
        inputProduto.style.opacity = '1';
        setTimeout(() => inputProduto.focus(), 100);
      }
      document.getElementById('estoque-quantidade').value = 0;
    }
  }

  function voltarParaListaEstoque() {
    document.getElementById('view-lista-estoque').style.display = 'block';
    document.getElementById('view-form-estoque').style.display = 'none';
    document.getElementById('btn-novo-estoque').style.display = 'block';
    document.getElementById('titulo-pagina-estoque').innerHTML = 'Controle de Estoque';
    document.getElementById('subtitulo-pagina-estoque').innerHTML = 'Gerencie a quantidade por produto';
    carregarListaEstoque();
  }

  function salvarEstoque() {
    const produtoDigitado = (document.getElementById('estoque-produto').value || '').trim();
    const dados = {
      produto: produtoDigitado,
      quantidade: document.getElementById('estoque-quantidade').value,
      produtoOriginal: document.getElementById('estoque-produto-original').value
    };

    if (!dados.produto) return showToast('Selecione ou digite um produto.', false);

    // Validação: garante que o produto existe no catálogo de produtos
    const prodCatalogado = (produtosGlobais || []).find(p => p[0].trim().toLowerCase() === dados.produto.toLowerCase());
    if (!prodCatalogado) {
      return showToast(`O produto "${dados.produto}" não foi encontrado no catálogo. Cadastre-o primeiro na aba Produtos.`, false);
    }
    // Normaliza para o nome oficial cadastrado no catálogo
    dados.produto = prodCatalogado[0];

    if (isNaN(parseInt(dados.quantidade, 10)) || parseInt(dados.quantidade, 10) < 0) return showToast('Informe uma quantidade válida.', false);

    setLoading('btn-estoque', true, 'Salvar Estoque');

    const metodoBackend = dados.produtoOriginal ? 'atualizarEstoqueItem' : 'salvarEstoqueItem';

    google.script.run.withSuccessHandler(res => {
      showToast(res.mensagem, res.sucesso);
      setLoading('btn-estoque', false, 'Salvar Estoque');
      if (res.sucesso === true) {
        voltarParaListaEstoque();
        carregarHistoricoEstoque();
      }
    })[metodoBackend](dados);
  }

  function abrirEdicaoEstoque(index) {
    const item = estoqueGlobais[index];
    if (!item) return;

    document.getElementById('estoque-produto-original').value = item[0];
    document.getElementById('estoque-quantidade').value = item[1];

    mostrarFormEstoque(true, item[0]);
  }

  function confirmarExcluirEstoque(produto) {
    if (confirm(`Tem certeza que deseja remover o item do estoque para ${produto}?`)) {
      google.script.run.withSuccessHandler(res => {
        showToast(res.mensagem, res.sucesso);
        carregarListaEstoque();
        carregarHistoricoEstoque();
      }).excluirEstoqueItem(produto);
    }

  // =========================================================
  // MÓDULO: HISTÓRICO DE ESTOQUE DEDICADO
  // =========================================================

  function irParaHistoricoEstoque(produtoFiltro = '') {
    const navBtn = document.getElementById('nav-btn-estoque-historico');
    showPage('page-estoque-historico', navBtn);

    setTimeout(() => {
      if (produtoFiltro) {
        const selectProd = document.getElementById('filtro-historico-produto');
        if (selectProd) {
          selectProd.value = produtoFiltro;
          filtrarHistoricoEstoque();
        }
      }
    }, 100);
  }

  function voltarParaEstoquePrincipal() {
    const navButtons = document.querySelectorAll('.nav-btn');
    let targetBtn = null;
    navButtons.forEach(btn => {
      const onclickAttr = btn.getAttribute('onclick') || '';
      if (onclickAttr.includes("'page-estoque'")) {
        targetBtn = btn;
      }
    });
    showPage('page-estoque', targetBtn || document.querySelector('.nav-btn'));
  }

  function carregarHistoricoEstoque(callback) {
    google.script.run.withSuccessHandler(historico => {
      historicoEstoqueGlobais = historico || [];
      filtrarHistoricoEstoque();
      atualizarSelectProdutosHistorico();
      if (typeof callback === 'function') callback();
    }).withFailureHandler(err => {
      showToast('Erro ao carregar histórico de estoque: ' + err, false);
      if (typeof callback === 'function') callback();
    }).getHistoricoEstoque();
  }

  function recarregarHistoricoEstoque(btn) {
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-arrows-rotate fa-spin"></i> Atualizando...';
    }
    carregarHistoricoEstoque(() => {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrows-rotate"></i> Atualizar';
      }
      showToast('Histórico de estoque atualizado!', true);
    });
  }

  function atualizarSelectProdutosHistorico() {
    const select = document.getElementById('filtro-historico-produto');
    if (!select) return;
    const valorAtual = select.value;
    let html = '<option value="">Todos os Produtos</option>';

    const nomes = new Set();
    (produtosGlobais || []).forEach(p => { if (p && p[0]) nomes.add(p[0]); });
    (historicoEstoqueGlobais || []).forEach(h => { if (h && h[1]) nomes.add(h[1]); });

    Array.from(nomes).sort().forEach(nome => {
      html += `<option value="${nome}" ${nome === valorAtual ? 'selected' : ''}>${nome}</option>`;
    });
    select.innerHTML = html;
  }

  function filtrarHistoricoEstoque() {
    const prodFiltro = (document.getElementById('filtro-historico-produto')?.value || '').trim().toLowerCase();
    const tipoFiltro = (document.getElementById('filtro-historico-tipo')?.value || '').trim().toLowerCase();
    const buscaFiltro = (document.getElementById('filtro-historico-busca')?.value || '').trim().toLowerCase();

    const filtrados = (historicoEstoqueGlobais || []).filter(item => {
      const dataHora = String(item[0] || '').toLowerCase();
      const produto = String(item[1] || '').toLowerCase();
      const tipo = String(item[2] || '').toLowerCase();
      const ref = String(item[6] || '').toLowerCase();
      const obs = String(item[7] || '').toLowerCase();

      if (prodFiltro && produto !== prodFiltro) return false;
      if (tipoFiltro && !tipo.includes(tipoFiltro)) return false;
      if (buscaFiltro) {
        const achou = dataHora.includes(buscaFiltro) ||
                      produto.includes(buscaFiltro) ||
                      tipo.includes(buscaFiltro) ||
                      ref.includes(buscaFiltro) ||
                      obs.includes(buscaFiltro);
        if (!achou) return false;
      }
      return true;
    });

    renderizarTabelaHistoricoEstoque(filtrados);
  }

  function renderizarTabelaHistoricoEstoque(dados) {
    const tbody = document.getElementById('corpo-tabela-estoque-historico');
    if (!tbody) return;

    if (!dados || dados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: var(--text-muted); padding: 35px;">Nenhuma movimentação de estoque encontrada com os filtros atuais.</td></tr>';
      return;
    }

    let html = '';
    dados.forEach(item => {
      const dataHora = item[0] || '-';
      const produto = item[1] || '-';
      const tipo = String(item[2] || 'Ajuste');
      const qtdNum = Number(item[3]) || 0;
      const saldoAnterior = item[4] !== undefined && item[4] !== '' ? item[4] : '-';
      const saldoNovo = item[5] !== undefined && item[5] !== '' ? item[5] : '-';
      const ref = item[6] || '-';
      const obs = item[7] || '-';

      let badgeStyle = 'background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3);';
      let icone = 'fa-sliders';
      let qtdCor = 'var(--text-main)';
      let sinalQtd = '';

      const tipoLower = tipo.toLowerCase();
      if (tipoLower.includes('entrada') || tipoLower.includes('reposição') || tipoLower.includes('inicial')) {
        badgeStyle = 'background: rgba(16, 185, 129, 0.15); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.3);';
        icone = 'fa-arrow-down-long';
        qtdCor = 'var(--success)';
        sinalQtd = qtdNum > 0 ? '+' : '';
      } else if (tipoLower.includes('saída') || tipoLower.includes('venda')) {
        badgeStyle = 'background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3);';
        icone = 'fa-arrow-up-long';
        qtdCor = 'var(--error)';
        sinalQtd = '';
      } else if (tipoLower.includes('estorno')) {
        badgeStyle = 'background: rgba(14, 165, 233, 0.15); color: var(--accent); border: 1px solid rgba(14, 165, 233, 0.3);';
        icone = 'fa-rotate-left';
        qtdCor = 'var(--accent)';
        sinalQtd = qtdNum > 0 ? '+' : '';
      } else if (tipoLower.includes('exclusão')) {
        badgeStyle = 'background: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3);';
        icone = 'fa-trash';
        qtdCor = 'var(--error)';
      } else {
        badgeStyle = 'background: rgba(245, 158, 11, 0.15); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.3);';
        icone = 'fa-sliders';
        qtdCor = qtdNum > 0 ? 'var(--success)' : (qtdNum < 0 ? 'var(--error)' : 'var(--text-muted)');
        sinalQtd = qtdNum > 0 ? '+' : '';
      }

      html += `
        <tr>
          <td style="white-space: nowrap; font-size: 13px; color: var(--text-muted);">${dataHora}</td>
          <td><strong style="color: var(--text-main);">${produto}</strong></td>
          <td>
            <span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; ${badgeStyle}">
              <i class="fa-solid ${icone}"></i> ${tipo}
            </span>
          </td>
          <td style="font-weight: 700; color: ${qtdCor}; font-size: 14px;">
            ${sinalQtd}${qtdNum}
          </td>
          <td style="color: var(--text-muted);">${saldoAnterior}</td>
          <td style="font-weight: 700; color: var(--text-main);">${saldoNovo}</td>
          <td><code style="background: var(--bg-input); padding: 2px 6px; border-radius: 4px; font-size: 12px; color: var(--text-muted);">${ref}</code></td>
          <td style="font-size: 13px; color: var(--text-muted); max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${obs}">${obs}</td>
        </tr>
      `;
    });

    tbody.innerHTML = html;
  }

  function processarCarrinho() {
    const inputCliente = document.getElementById('compra-cliente');
    const cliente = (inputCliente ? inputCliente.value : '').trim();
    const metodoPagamento = document.getElementById('compra-pagamento').value;
    const descricaoVenda = document.getElementById('compra-desc').value;
    const acrescimo = parseFloat(document.getElementById('venda-acrescimo').value) || 0;

    if (!cliente) return showToast("Selecione um cliente para a compra.", false);
    if (carrinhoDeCompras.length === 0) return showToast("Adicione pelo menos um item ao carrinho.", false);

    const txtLoading = idPedidoEdicao ? 'Salvando Alterações...' : 'Processando Venda...';
    setLoading('btn-compra', true, txtLoading);

    const dadosPayload = {
      idPedido: idPedidoEdicao,
      emailCliente: cliente, 
      metodoPagamento: metodoPagamento,
      descricaoVenda: descricaoVenda,
      itens: carrinhoDeCompras,
      custos: carrinhoDeVendaCustos,
      acrescimo: acrescimo
    };

    const metodoBackend = idPedidoEdicao ? 'atualizarCompra' : 'salvarCompra';

    google.script.run.withSuccessHandler(res => {
      showToast(res.mensagem, res.sucesso);
      setLoading('btn-compra', false, idPedidoEdicao ? 'Salvar Alterações' : 'Finalizar Transação');
      if (res.sucesso === true) {
        carrinhoDeCompras = [];
        carrinhoDeVendaCustos = [];
        idPedidoEdicao = null;
        atualizarInterfaceCarrinho();
        atualizarInterfaceCustosVenda();
        if (inputCliente) inputCliente.value = '';
        const inputProduto = document.getElementById('compra-produto');
        if (inputProduto) inputProduto.value = '';
        document.getElementById('compra-pagamento').selectedIndex = 0;
        document.getElementById('compra-desc').value = '';
        document.getElementById('venda-acrescimo').value = '';

        // Atualiza o estoque e histórico imediatamente, sem exigir reload da página.
        google.script.run.withSuccessHandler(estoque => {
          estoqueGlobais = estoque || [];
          renderizarTabelaEstoque(estoqueGlobais);
          carregarHistoricoEstoque();
        }).getEstoque();

        voltarParaListaVendas();
      }
    })[metodoBackend](dadosPayload);
  }

  function carregarListaVendas() {
    google.script.run.withSuccessHandler(vendas => {
      vendasGlobais = vendas;
      renderizarTabelaVendas(vendas);
      
      // Carrega custos atualizados para manter custosGlobais em sincronia
      google.script.run.withSuccessHandler(custos => {
        custosGlobais = custos;
      }).getCustos();
    }).getVendas();
  }

  function renderizarTabelaVendas(vendas) {
    const tbody = document.getElementById('corpo-tabela-vendas');
    if (!tbody) return;

    if (vendas.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--text-muted); padding: 30px;">Nenhuma venda registrada ainda.</td></tr>';
      return;
    }

    let html = '';
    [...vendas].reverse().forEach(v => {
      const idPedido = v[0];
      const data = v[1];
      const email = v[2];
      // v[3] é o valor registrado na planilha — exibido diretamente sem subtrair custos
      // (os custos ficam no painel de detalhes, calculados a partir dos itens)
      const valorRegistrado = parseReal(v[3]);
      const nomeCliente = v[4] || "";
      const metodoPagamento = v[5] || "Pix";
      const descricaoVenda = v[6] || "";

      const custosDaVenda = custosGlobais.filter(c => c[1] === idPedido);
      const temCustos = custosDaVenda.length > 0;
      const tooltipValor = temCustos
        ? `Há custos vinculados a esta venda. Abra os detalhes para ver o líquido.`
        : `Valor registrado: R$ ${valorRegistrado.toFixed(2)}`;

      html += `
        <tr>
          <td><strong style="color: var(--accent);">${idPedido}</strong></td>
          <td>${data}</td>
          <td>
            <strong style="color: var(--text-main);">${nomeCliente}</strong><br>
            <span style="font-size: 12px; color: var(--text-muted);">${email}</span>
          </td>
          <td><span class="badge-payment" data-method="${metodoPagamento}">${metodoPagamento}</span></td>
          <td style="font-size: 13px; color: var(--text-muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${descricaoVenda}">${descricaoVenda || '-'}</td>
          <td style="font-weight: 600; color: var(--success);" title="${tooltipValor}">
            R$ ${valorRegistrado.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
            ${temCustos ? '<i class="fa-solid fa-circle-info" style="font-size: 11px; color: var(--text-muted); margin-left: 5px;"></i>' : ''}
          </td>
          <td>
            <button class="btn-icon-action" onclick="abrirDetalhesVenda('${idPedido}')" title="Ver Itens">
              <i class="fa-solid fa-eye"></i>
            </button>
            <button class="btn-icon-action" onclick="editarVenda('${idPedido}')" title="Editar" style="color: var(--warning); margin-left: 10px;">
              <i class="fa-solid fa-pen-to-square"></i>
            </button>
            <button class="btn-icon-action" onclick="confirmarExcluirVenda('${idPedido}')" title="Excluir" style="color: var(--error); margin-left: 10px;">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function mostrarFormVenda() {
    idPedidoEdicao = null;
    carrinhoDeCompras = [];
    carrinhoDeVendaCustos = [];
    atualizarInterfaceCarrinho();
    atualizarInterfaceCustosVenda();

    document.getElementById('view-lista-venda').style.display = 'none';

    // Restaura texto padrão do botão

  function voltarParaListaVendas() {
    idPedidoEdicao = null;
    carrinhoDeCompras = [];
    carrinhoDeVendaCustos = [];
    atualizarInterfaceCarrinho();
    atualizarInterfaceCustosVenda();

    document.getElementById('view-lista-venda').style.display = 'block';
    document.getElementById('view-form-venda').style.display = 'none';
    document.getElementById('btn-nova-venda').style.display = 'block';

    const btnText = document.querySelector('#btn-compra .btn-text');

    const inputClienteVoltar = document.getElementById('compra-cliente');
    if (inputClienteVoltar) inputClienteVoltar.value = '';

  // =========================================================
  // CARRINHO DE CUSTOS DA VENDA
  // =========================================================

  function adicionarCustoVenda() {
    const tipo = document.getElementById('custo-tipo-venda').value;
    const valorStr = document.getElementById('custo-valor-venda').value;
    const desc = document.getElementById('custo-desc-venda').value.trim();
    const valor = parseFloat(valorStr);

    if (!tipo) return showToast('Selecione um tipo de custo.', false);
    if (isNaN(valor) || valor <= 0) return showToast('Informe um valor válido maior que zero.', false);

    carrinhoDeVendaCustos.push({ tipo, valor, desc });
    atualizarInterfaceCustosVenda();

    // Limpa os campos
    document.getElementById('custo-valor-venda').value = '';
    document.getElementById('custo-desc-venda').value = '';
  }

  function removerCustoVenda(index) {
    carrinhoDeVendaCustos.splice(index, 1);
    atualizarInterfaceCustosVenda();
  }

  function atualizarInterfaceCustosVenda() {
    const lista = document.getElementById('lista-custos-venda');
    const totalSpan = document.getElementById('custos-venda-total');
    if (!lista || !totalSpan) return;

    if (carrinhoDeVendaCustos.length === 0) {
      lista.innerHTML = '<li style="color: var(--text-muted); font-style: italic;">Nenhum custo adicionado ainda.</li>';
      totalSpan.textContent = '0.00';
      return;
    }

    let html = '';
    let totalCustos = 0;
    carrinhoDeVendaCustos.forEach((c, index) => {
      totalCustos += c.valor;
      const descLabel = c.desc ? ` <span style="color: var(--text-muted); font-size: 12px;">— ${c.desc}</span>` : '';
      html += `
        <li style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed rgba(255,255,255,0.1);">
          <span><strong style="color: var(--warning);">${c.tipo}</strong>${descLabel}</span>
          <span style="color: var(--warning); font-weight: 600;">R$ ${c.valor.toFixed(2)} <i class="fa-solid fa-trash" style="color: var(--error); cursor: pointer; margin-left: 12px;" onclick="removerCustoVenda(${index})"></i></span>
        </li>`;
    });

    lista.innerHTML = html;
    totalSpan.textContent = totalCustos.toFixed(2);
  }

  function abrirDetalhesVenda(idPedido) {
    document.getElementById('detalhes-venda-titulo').innerHTML = `Itens do Pedido: <span style="color: var(--cyan);">${idPedido}</span>`;
    const tbody = document.getElementById('corpo-tabela-detalhes-venda');
    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;"><div class="spinner" style="display:inline-block;"></div></td></tr>';
    
    const venda = vendasGlobais.find(v => v[0] === idPedido);
    const metaContainer = document.getElementById('detalhes-venda-meta');
    if (venda && metaContainer) {
      const metodo = venda[5] || "Pix";
      const desc = venda[6] || "";
      metaContainer.innerHTML = `
        <div style="display: grid; grid-template-columns: auto 1fr; gap: 30px; align-items: start;">
          <div>
            <strong style="color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Método de Pagamento</strong>
            <span class="badge-payment" data-method="${metodo}">${metodo}</span>
          </div>
          <div>
            <strong style="color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px;">Descrição / Observações da Venda</strong>
            <div style="color: var(--text-main); font-size: 14px; line-height: 1.6; white-space: pre-wrap; background: rgba(0,0,0,0.15); border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px;">${desc || '<span style="color: var(--text-muted); font-style: italic;">Nenhuma observação registrada.</span>'}</div>
          </div>
        </div>
      `;
      metaContainer.style.display = 'block';
    } else if (metaContainer) {
      metaContainer.style.display = 'none';
    }

    // Processa e exibe os custos associados a essa venda
    const containerCustos = document.getElementById('detalhes-venda-custos-container');
    const tbodyCustos = document.getElementById('corpo-tabela-detalhes-venda-custos');
    const resumoValoresEl = document.getElementById('detalhes-venda-resumo-valores');

    const custosDaVenda = custosGlobais.filter(c => c[1] === idPedido);
    const totalCustosDetalhe = custosDaVenda.reduce((acc, c) => acc + parseReal(c[3]), 0);

    if (containerCustos && tbodyCustos) {
      if (custosDaVenda.length > 0) {
        let htmlCustos = '';
        custosDaVenda.forEach(c => {
          const tipo = c[2];
          const valor = parseReal(c[3]);
          const desc = c[5] || '-';
          htmlCustos += `
            <tr>
              <td><strong style="color: var(--warning);">${tipo}</strong></td>
              <td>${desc}</td>
              <td style="font-weight: 600; color: var(--error);">R$ ${valor.toFixed(2)}</td>
            </tr>
          `;
        });
        tbodyCustos.innerHTML = htmlCustos;
        containerCustos.style.display = 'block';
      } else {
        containerCustos.style.display = 'none';
      }
    }

    // Oculta o resumo até os itens carregarem (o bruto é calculado a partir dos itens)
    if (resumoValoresEl) resumoValoresEl.style.display = 'none';

    document.getElementById('view-detalhes-venda').style.display = 'block';
    document.getElementById('view-detalhes-venda').scrollIntoView({ behavior: 'smooth' });

    google.script.run.withSuccessHandler(itens => {
      if (itens.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">Nenhum item encontrado.</td></tr>';
        return;
      }

      let html = '';
      // O bruto é sempre a soma dos subtotais dos itens (fonte de verdade confiável)
      let valorBrutoItens = 0;
      itens.forEach(it => {
        valorBrutoItens += parseFloat(it[2]) || 0;
        html += `
          <tr>
            <td>${it[0]}</td>
            <td>${it[1]}</td>
            <td style="font-weight: 600;">R$ ${parseFloat(it[2]).toFixed(2)}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;

      // Calcula o líquido usando o bruto real (soma dos itens) — evita dupla subtração
      const valorLiquidoDetalhe = valorBrutoItens - totalCustosDetalhe;

      if (resumoValoresEl) {
        resumoValoresEl.innerHTML = `
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px;">
            <div style="background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Valor Bruto</div>
              <div style="font-size: 18px; font-weight: 700; color: var(--text-main);">R$ ${valorBrutoItens.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
            <div style="background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center;">
              <div style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Total de Custos</div>
              <div style="font-size: 18px; font-weight: 700; color: var(--error);">- R$ ${totalCustosDetalhe.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
            <div style="background: rgba(var(--success-rgb, 34,197,94), 0.1); border: 1px solid var(--success); border-radius: 10px; padding: 16px; text-align: center;">
              <div style="font-size: 11px; color: var(--success); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">Valor Líquido</div>
              <div style="font-size: 22px; font-weight: 800; color: var(--success);">R$ ${valorLiquidoDetalhe.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
            </div>
          </div>
        `;
        resumoValoresEl.style.display = 'block';
      }
    }).getItensVenda(idPedido);
  }

  function editarVenda(idPedido) {
    const venda = vendasGlobais.find(v => v[0] === idPedido);
    if (!venda) return showToast("Erro: Venda não encontrada.", false);

    idPedidoEdicao = idPedido;

    // 1. Muda para visualização do formulário
    document.getElementById('view-lista-venda').style.display = 'none';
    document.getElementById('view-form-venda').style.display = 'block';
    document.getElementById('btn-nova-venda').style.display = 'none';
    document.getElementById('view-detalhes-venda').style.display = 'none';

    // 2. Altera títulos
    document.getElementById('titulo-pagina-venda').innerHTML = `Editar Venda: <span style="color: var(--cyan);">${idPedido}</span>`;
    document.getElementById('subtitulo-pagina-venda').innerHTML = 'Atualize os produtos, quantidades e custos vinculados a este pedido';

    // 3. Atualiza o texto do botão finalizar compra
    const btnText = document.querySelector('#btn-compra .btn-text');
    if (btnText) btnText.textContent = 'Salvar Alterações';

    // 4. Carrega metadados (preenche datalists de Clientes e Produtos) e depois seleciona o cliente correspondente
    google.script.run.withSuccessHandler(dados => {
      produtosGlobais = dados.produtos;
      popularDatalistCompra(dados);

      // Preenche o cliente da venda (usa email se houver, senão nome)
      const valCliente = venda[2] || venda[4] || '';
      const inputCliente = document.getElementById('compra-cliente');
      if (inputCliente) inputCliente.value = valCliente;

      const inputProduto = document.getElementById('compra-produto');
      if (inputProduto) inputProduto.value = '';

      document.getElementById('compra-subtotal').value = '';
    }).getDadosParaCompra();

    // 5. Preenche os outros campos básicos
    document.getElementById('compra-pagamento').value = venda[5] || "Pix";
    document.getElementById('compra-desc').value = venda[6] || "";

    // 6. Mapeia e preenche os custos vinculados a essa venda
    const custosDaVenda = custosGlobais.filter(c => c[1] === idPedido);
    carrinhoDeVendaCustos = custosDaVenda.map(c => ({
      tipo: c[2],
      valor: parseReal(c[3]),
      desc: c[5] || ""
    }));
    atualizarInterfaceCustosVenda();

    // 7. Busca os itens comprados da venda no backend e preenche o carrinho de compras
    const tbody = document.getElementById('lista-carrinho');
    if (tbody) {
      tbody.innerHTML = '<li style="color: var(--text-muted); font-style: italic; text-align: center; padding: 10px 0;"><div class="spinner" style="display:inline-block; width:15px; height:15px;"></div> Carregando itens...</li>';
    }

    google.script.run.withSuccessHandler(itens => {
      carrinhoDeCompras = itens.map(it => ({
        produto: it[0],
        quantidade: parseInt(it[1]),
        valorTotal: parseFloat(it[2])
      }));
      atualizarInterfaceCarrinho();
    }).getItensVenda(idPedido);
  }

    if (!rentabilidade || rentabilidade.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhum produto cadastrado no catálogo.</td></tr>';
      return;
    }

    let html = '';
    rentabilidade.forEach(r => {
      const margemVal = parseFloat(r.margem);
      let badgeClass = 'excellent';
      if (margemVal <= 0) {
        badgeClass = 'danger';
      } else if (margemVal < 30) {
        badgeClass = 'warning';
      }

      html += `
        <tr>
          <td><strong>${r.nome}</strong></td>
          <td style="font-weight: 500; color: var(--text-main);">R$ ${parseFloat(r.bruto).toFixed(2)}</td>
          <td style="color: var(--error);">R$ ${parseFloat(r.custo).toFixed(2)}</td>
          <td style="font-weight: 600; color: ${parseFloat(r.liquido) >= 0 ? 'var(--success)' : 'var(--error)'};">R$ ${parseFloat(r.liquido).toFixed(2)}</td>
          <td><span class="badge-margin ${badgeClass}">${margemVal.toFixed(1)}%</span></td>
          <td>
            <button class="btn-icon-action" onclick="visualizarDetalhesCustosProduto('${r.nome}')" title="Visualizar Custos Adicionados">
              <i class="fa-solid fa-eye"></i>
            </button>
          </td>
        </tr>
      `;
    });
    tbody.innerHTML = html;
  }

  function salvarNovoCusto() {
    const idCusto = document.getElementById('custo-id-edicao').value;
    const produto = document.getElementById('custo-produto').value;
    const tipoCusto = document.getElementById('custo-tipo').value;
    const valor = document.getElementById('custo-valor').value;
    const data = document.getElementById('custo-data').value;
    const descricao = document.getElementById('custo-desc').value;

    if (!produto) return showToast("Por favor, selecione um produto.", false);
    if (!valor || parseFloat(valor) <= 0) return showToast("Por favor, insira um valor válido maior que zero.", false);
    if (!data) return showToast("Por favor, selecione uma data válida.", false);

    setLoading('btn-salvar-custo', true, 'Salvar Custo');

    const dados = {
      idCusto: idCusto,
      produto: produto,
      tipoCusto: tipoCusto,
      valor: valor,
      data: data,
      descricao: descricao
    };

    const isEdicao = !!idCusto;
    const runner = google.script.run
      .withSuccessHandler(res => {
        showToast(res.mensagem, res.sucesso);
        setLoading('btn-salvar-custo', false, 'Salvar Custo');
        if (res.sucesso) {
          voltarParaListaCustos();
        }
      })
      .withFailureHandler(err => {
        showToast("Erro ao processar custo: " + err, false);
        setLoading('btn-salvar-custo', false, 'Salvar Custo');
      });

    if (isEdicao) {
      runner.atualizarCusto(dados);
    } else {
      runner.salvarCusto(dados);
    }
  }

  function editarCusto(idCusto) {
    const custo = custosGlobais.find(c => c[0] === idCusto);
    if (!custo) return showToast("Erro: Lançamento de custo não localizado.", false);

    mostrarFormCusto();
    document.getElementById('form-custo-titulo').textContent = 'Editar Lançamento de Custo';
    
    document.getElementById('custo-id-edicao').value = custo[0];
    document.getElementById('custo-produto').value = custo[1];
    document.getElementById('custo-tipo').value = custo[2];
    document.getElementById('custo-valor').value = parseFloat(custo[3]);
    
    // Converte a data do formato pt-BR (DD/MM/AAAA) para AAAA-MM-DD para o input type="date"
    const partesData = custo[4].split('/');
    if (partesData.length === 3) {
      document.getElementById('custo-data').value = `${partesData[2]}-${partesData[1]}-${partesData[0]}`;
    }
    
    document.getElementById('custo-desc').value = custo[5] || "";
  }

  function confirmarExcluirCusto(idCusto) {
    if (confirm(`Tem certeza que deseja excluir permanentemente o lançamento de custo ${idCusto}?`)) {
      google.script.run.withSuccessHandler(res => {
        showToast(res.mensagem, res.sucesso);
        carregarListaCustos();
      }).excluirCusto(idCusto);
    }
  }

  function visualizarDetalhesCustosProduto(prodNome) {
    const painel = document.getElementById('view-detalhes-custos-produto');
    const titulo = document.getElementById('detalhes-custos-produto-titulo');
    const tbody = document.getElementById('corpo-tabela-detalhes-custos-produto');

    if (!painel || !titulo || !tbody) return;

    // Filtra os custos que pertencem ao produto selecionado
    const custosFiltrados = custosGlobais.filter(c => c[1] === prodNome);

    titulo.textContent = `Detalhamento de Custos: ${prodNome}`;

    if (custosFiltrados.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">Nenhum lançamento de custo associado a este produto ainda.</td></tr>';
    } else {
      let html = '';
      custosFiltrados.forEach(c => {
        const idCusto = c[0];
        const tipo = c[2];
        const valor = parseReal(c[3]);
        const data = c[4];
        const desc = c[5] || "";
        
        html += `
          <tr>
            <td><strong style="color: var(--accent); font-size: 11px;">${idCusto}</strong></td>
            <td><span style="font-size: 13px; color: var(--text-muted);">${tipo}</span></td>
            <td style="font-weight: 600; color: var(--error);">R$ ${valor.toFixed(2)}</td>
            <td>${data}</td>
            <td style="font-size: 13px; color: var(--text-muted); white-space: pre-wrap;">${desc || '-'}</td>
          </tr>
        `;
      });
      tbody.innerHTML = html;
    }

    // Exibe o painel de detalhes com animação suave e scroll suave
    painel.style.display = 'block';
    painel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function fecharDetalhesCustosProduto() {
    const painel = document.getElementById('view-detalhes-custos-produto');
    if (painel) {
      painel.style.display = 'none';
    }
  }

</script>
